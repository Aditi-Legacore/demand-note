name: Build and Push Docker Images

on:
  push:
    branches:
      - release/v1.0.1

jobs:

  # -------------------------
  # Frontend
  # -------------------------
  frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/demand-note-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/demand-note-frontend:${{ github.sha }}

      - name: Deploy Frontend (Coolify)
        run: |
          curl -X POST "http://143.244.141.58:8000/api/v1/deploy?uuid=FRONTEND_UUID&force=true"


  # -------------------------
  # Backend
  # -------------------------
  backend:
    name: Build Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/demand-note-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/demand-note-backend:${{ github.sha }}

      - name: Deploy Backend (Coolify)
        run: |
          curl -X POST "http://143.244.141.58:8000/api/v1/deploy?uuid=BACKEND_UUID&force=true"