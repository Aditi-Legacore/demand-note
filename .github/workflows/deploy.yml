name: Build and Push Combined Image

on:
  push:
    branches:
      - release/v1.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Combined Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/demand-note:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/demand-note:${{ github.sha }}

  trigger-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy
        run: |
          curl -X POST "http://143.244.141.58:8000/api/v1/deploy?uuid=zb433vr4scqn2wh7jhok6lfn&force=false"