name: Build and Push Docker Images

on:
  push:
    branches:
      - release/v1.0.1

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/demand-note-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/demand-note-frontend
  BACKEND_PORT: 8000
  FRONTEND_PORT: 3000

jobs:

  # -------------------------
  # Backend
  # -------------------------
  backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Deploy Backend (Coolify)
        run: |
          curl -X POST "http://143.244.141.58:8000/api/v1/deploy?uuid=BACKEND_UUID&force=true"


  # -------------------------
  # Frontend
  # -------------------------
  frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: backend  # Ensure backend builds first

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Frontend Env Variable for Backend
        run: |
          echo "REACT_APP_BACKEND_URL=http://backend:${{ env.BACKEND_PORT }}" >> $GITHUB_ENV

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            REACT_APP_BACKEND_URL=${{ env.REACT_APP_BACKEND_URL }}

      - name: Deploy Frontend (Coolify)
        run: |
          curl -X POST "http://143.244.141.58:8000/api/v1/deploy?uuid=FRONTEND_UUID&force=true"